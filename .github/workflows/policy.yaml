name: Release Policy

# repo-release-tools policy gate. Configuration lives in [tool.rrt] in
# pyproject.toml. Branch-name and per-PR changelog checks are intentionally off:
# Renovate, Copilot and Claude branches use their own naming, and the changelog
# is promoted at release time with `rrt bump`.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check commit subjects and artifact fingerprints
        uses: Anselmoo/repo-release-tools@v1.18.0
        with:
          check-branch-name: "false"
          check-commit-subject: "true"
          check-changelog: "false"
          check-artifacts: "true"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Check version targets agree
        # Keep the version in sync with the rrt hook `rev` in .pre-commit-config.yaml.
        run: uvx --from "repo-release-tools==1.18.0" rrt release check
