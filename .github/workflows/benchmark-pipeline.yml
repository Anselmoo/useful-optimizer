name: Benchmark Pipeline

# Runs the benchmark suite (see benchmarks/protocol.py and docs/benchmarks/methodology.md)
# as one job per category x function, merges the raw cells and aggregates them into the
# data the docs site reads. Results are an artifact; they are committed to the docs only
# when a manual run sets `publish`, so scheduled runs do not fill the git history.

on:
  schedule:
    # Monthly: every optimizer.
    - cron: '0 3 1 * *'
    # Weekly: the small showcase tier, a smoke test of the pipeline.
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      tier:
        description: 'Optimizer tier'
        required: true
        default: comprehensive
        type: choice
        options:
          - showcase
          - standard
          - comprehensive
      n_runs:
        description: 'Independent runs per cell'
        required: true
        default: '15'
        type: string
      publish:
        description: 'Commit the aggregated data to docs/public/benchmarks and redeploy the docs'
        required: true
        default: false
        type: boolean

concurrency:
  group: benchmark-pipeline
  cancel-in-progress: false

permissions:
  contents: read

env:
  TIER: ${{ inputs.tier || (github.event.schedule == '0 3 1 * *' && 'comprehensive' || 'showcase') }}
  N_RUNS: ${{ inputs.n_runs || '15' }}

jobs:
  plan:
    name: Plan shards
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.shards.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --extra benchmark

      - name: List shards
        id: shards
        run: |
          matrix=$(uv run python benchmarks/run_benchmark_suite.py --tier "$TIER" --list-shards)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix" | python3 -c "import json,sys; print(len(json.load(sys.stdin)), 'shards')"

  benchmark:
    name: ${{ matrix.category }} / ${{ matrix.function }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --extra benchmark

      - name: Run shard
        # Every finished cell is written to its own file, so a cut-off job still
        # uploads what it completed and a re-run with --resume continues.
        run: |
          uv run python benchmarks/run_benchmark_suite.py \
            --tier "$TIER" \
            --category "${{ matrix.category }}" \
            --functions "${{ matrix.function }}" \
            --n-runs "$N_RUNS" \
            --workers 4 \
            --resume \
            --output-dir benchmarks/output

      - name: Upload raw cells
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: raw-${{ matrix.category }}-${{ matrix.function }}
          path: benchmarks/output/
          retention-days: 14
          if-no-files-found: ignore
          compression-level: 9

  aggregate:
    name: Aggregate
    needs: [plan, benchmark]
    # Aggregate what exists even if a shard failed; only a fully successful run publishes.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # only used when publishing
      actions: write # starts the docs deployment after publishing
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --extra benchmark

      - name: Download raw cells
        uses: actions/download-artifact@v8
        with:
          pattern: raw-*
          merge-multiple: true
          path: benchmarks/output

      - name: Aggregate and validate
        # The aggregator validates every file against the schema (benchmarks/models.py).
        run: |
          uv run python benchmarks/aggregate_results.py \
            --input benchmarks/output \
            --output-dir benchmarks/output/processed \
            --optimizers-json docs/public/optimizers/optimizers.json
          du -sh benchmarks/output/processed

      - name: Summary
        run: |
          uv run python - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, os, pathlib
          root = pathlib.Path("benchmarks/output/processed")
          index = json.loads((root / "index.json").read_text())
          protocol = index["protocol"]
          print("## Benchmark results")
          print()
          print(f"- Tier: `{os.environ['TIER']}`")
          print(f"- Optimizers: {len(index['optimizers'])}")
          print(f"- Cells: {len(index['cells'])}")
          print(f"- Budget: {protocol['budget_per_dim']} evaluations x dimension, {protocol['n_runs']} runs")
          print(f"- Generated: {index['generated']} ({index['git_sha']})")
          PY

      - name: Upload benchmark data
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-data-${{ github.sha }}
          path: benchmarks/output/processed/
          retention-days: 90
          compression-level: 9

      - name: Publish to docs
        if: ${{ inputs.publish && inputs.tier == 'comprehensive' && needs.benchmark.result == 'success' }}
        run: |
          rm -rf docs/public/benchmarks
          mkdir -p docs/public/benchmarks
          cp -r benchmarks/output/processed/. docs/public/benchmarks/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/public/benchmarks
          if git diff --cached --quiet; then
            echo "No benchmark data changes to publish."
          else
            git commit -m "chore: update benchmark data"
            git push
            # A push made with GITHUB_TOKEN does not trigger other workflows, so
            # without this the refreshed data never reaches the live site.
            gh workflow run docs.yaml --ref "$GITHUB_REF_NAME"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
