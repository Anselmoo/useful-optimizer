[project]
name = "useful-optimizer"
version = "0.1.2"
description = "A dedicated set of optimization algorithms for numeric problems."
authors = [{ name = "Anselm Hahn", email = "Anselm.Hahn@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.15,<3.16"
dependencies = [
    "numpy>=1.26.4",
 "scipy>=1.12.0",
 "scikit-learn>=1.5.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.17.1",
    "pytest>=8.0.0",
    "pre-commit>=4.7.0",
]
visualization = [
    "matplotlib>=3.7.0",
]
benchmark = [
    "pydantic>=2.12.5",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "opt"

[dependency-groups]
dev = [
    "ruff>=0.17.1",
    "pytest>=8.0.0",
    "pre-commit>=4.7.0",
    "ty>=0.0.1",
    "datamodel-code-generator>=0.48.0",
    "griffe>=1.15.0",
]
validate = [
    "pydantic>=2.12.5",
    "jsonschema>=4.23.0",
]

[tool.pytest.ini_options]
addopts = [
    "--doctest-modules",
    "--doctest-glob=*.md",
    "-v",
]
testpaths = ["src/opt"]

[tool.ruff]
# Markdown is documentation here: the generated pages are fingerprinted by rrt, so ruff
# must not rewrite their code blocks (ruff >= 0.15 lints and formats *.md).
extend-exclude = ["*.md"]
force-exclude = true

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
# Same as Black.
line-length = 88
indent-width = 4
# Define Python target versions.
target-version = "py312"
src = ["src"]
# Add more options as needed

fix = true
preview = false


[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
# Set to all
select = ["ALL"]
# Preview rules are opt-in one by one: ALL does not pull in unstable rules, so a ruff
# upgrade cannot suddenly add dozens of findings. Left out on purpose: PLR6104 (an
# in-place `+=` on a numpy array changes aliasing and dtype behaviour of the optimizers),
# RUF069 (exact float comparisons are what the tests assert) and the design/docstring
# preview rules (PLR6301, PLR0914, PLW0717, PLR1702, DOC*).
preview = true
explicit-preview-rules = true
extend-select = [
    "PLW1514",   # open() without encoding
    "PLR6201",  # membership test against a list/tuple literal -> set literal
    "FURB113",   # repeated .append() -> .extend()
    "FURB118",   # lambda that reimplements an operator -> operator.*
    "PLC1901",   # `x == ""` -> `not x`
    "RUF052",    # underscore-prefixed local that is used
    "PYI033",    # legacy type comments
    "F822",      # name in __all__ that is not defined
]
# What stays ignored, and why. Everything else is enforced (issue #82).
ignore = [
    "PLR0913",   # Too many arguments: the optimizers' public constructors are their hyperparameters
    "PLR0917",   # Too many positional arguments: same constructors (keyword-only would break callers)
    "CPY001",    # Missing copyright notice: no per-file headers; the licence lives in LICENSE
    "N803",      # Argument name not lowercase: public API (renaming breaks keyword callers)
    "E501",      # Line too long: ruff format wraps code; long lines left are docstring tables and formulas
    "COM812",    # Missing trailing comma: conflicts with the formatter (ruff warns about the pair)
    "NPY002",    # Legacy numpy random: switching to Generator changes the seeded results of every optimizer
    "T201",      # Print statements: demos, examples and CLI scripts
    "PLR2004",   # Magic values: algorithm constants; being moved into named constants file by file
    "PLR0912",   # Too many branches: the algorithms are what they are
    "PLR0915",   # Too many statements: same
    "C901",      # Too complex: same
    "D107",      # Missing docstring in __init__: the class docstring documents the arguments
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []
exclude = [".venv"]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"src/opt/test/*" = ["S101", "PLR2004", "PLC0415", "ANN001", "ANN201", "ICN001", "S108", "D103"]
"src/opt/visualization/*" = ["FBT001", "FBT002", "FBT003", "PLC0415", "PLR2004", "ANN003", "S101", "B905"]
"src/opt/abstract_optimizer.py" = ["FBT001", "FBT002"]
"src/opt/swarm_intelligence/particle_swarm.py" = ["FBT001", "FBT002"]
"src/opt/social_inspired/social_group_optimizer.py" = ["FBT001", "FBT002"]
"benchmarks/*" = ["PERF203", "S101", "ANN001", "ANN201", "ANN003"]
"src/opt/demo.py" = ["TC002", "ANN401"]
"scripts/docstring_models.py" = ["D200", "D415", "FBT003", "D101", "TC002"]  # Generated code - ignore docstring style
"scripts/unified_validator.py" = ["FBT001", "FBT002", "TRY300"]  # CLI script
"scripts/test/*" = ["S101", "D103"]  # Test files - allow assert, no docstrings on test functions
"benchmarks/test/*" = ["S101", "PLR2004", "D101", "D102", "D103", "ARG005", "PT012", "SIM105", "S110", "BLE001"]  # Test files
# Variables named after the symbols of the source paper or of the linear algebra (A, C, D, X, K).
"src/opt/probabilistic/bayesian_optimizer.py" = ["N806"]
"src/opt/swarm_intelligence/dingo_optimizer.py" = ["N806"]
"src/opt/swarm_intelligence/grey_wolf_optimizer.py" = ["N806"]
"src/opt/swarm_intelligence/mountain_gazelle.py" = ["N806"]
"src/opt/swarm_intelligence/orca_predator.py" = ["N806"]
"src/opt/swarm_intelligence/whale_optimization_algorithm.py" = ["N806"]



[tool.ruff.lint.pydocstyle]

# Ignore a few common errors and warnings.
# Set the default docstring convention to Google.
convention = "google"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = true

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Format all docstring code snippets with a line length of 88.
docstring-code-line-length = 88


# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = true
[tool.ruff.lint.isort]
# If True, forces all imports to be on their own line. This is the opposite of the default behavior.
force-single-line = true

# The number of lines to leave between import sections. Default is '0'.
lines-between-types = 1

# The number of lines to leave after the last import. Default is '2'.
lines-after-imports = 2

# A list of names to treat as third party when encountered.
known-third-party = ["numpy", "scipy", "scikit-learn"]

# A list of imports that must be present for a file to be considered valid. This is useful for adding future import statements.
required-imports = ["from __future__ import annotations"]

# If True, makes sorting case sensitive.
case-sensitive = true

# If True, combines as imports on the same line.
combine-as-imports = true

# [tool.ruff.lint.flake8-copyright]
# author = "Anselm Hahn"
# min-file-size = 1024
# notice-rgx = "(?i)Copyright \\(C\\) \\d{4}"


[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true


[tool.ruff.lint.flake8-type-checking]
# Add quotes around type annotations, if doing so would allow
# an import to be moved into a type-checking block.
# quote-annotations = true
strict = true

[tool.ty.environment]
python-version = "3.12"

# repo-release-tools (rrt) — integrity tracking for generated documentation.
# `rrt artifacts --snapshot` writes .rrt/artifacts.lock.toml; the
# rrt-artifacts-check pre-commit/pre-push hook fails when a tracked generated
# file drifts from its committed fingerprint. See scripts/generate_docs.py.
[tool.rrt]
release_branch = "release/v{version}"

[[tool.rrt.version_targets]]
path = "pyproject.toml"
kind = "pep621"

# Every other place that repeats the version; `rrt bump` updates them together
# and `rrt release check` fails when they disagree.
[[tool.rrt.version_targets]]
path = "src/opt/__init__.py"
kind = "pattern"
pattern = '^__version__ = "([^"]+)"$'

[[tool.rrt.version_targets]]
path = "src/opt/benchmark/__init__.py"
kind = "pattern"
pattern = '^__version__ = "([^"]+)"$'

[[tool.rrt.version_targets]]
path = "docs/.vitepress/config.ts"
kind = "pattern"
pattern = "text: 'v([0-9]+\\.[0-9]+\\.[0-9]+[^']*)',"

[[tool.rrt.version_targets]]
path = "README.md"
kind = "pattern"
pattern = '^The current version of Useful Optimizer is ([0-9]+\.[0-9]+\.[0-9]+[^.\s]*)\.$'

[[tool.rrt.artifact_targets]]
path = "docs/algorithms/*/*.md"
description = "Generated optimizer algorithm pages"

[[tool.rrt.artifact_targets]]
path = "docs/algorithms/index.md"
description = "Algorithm overview with generated catalog"

[[tool.rrt.artifact_targets]]
path = "docs/api/*.md"
description = "API reference pages (module pages generated per category)"

[[tool.rrt.artifact_targets]]
path = "docs/public/optimizers/optimizers.json"
description = "Generated optimizer metadata index"

[[tool.rrt.artifact_targets]]
path = "docs/.vitepress/algorithmsSidebar.ts"
description = "Generated algorithms sidebar"
